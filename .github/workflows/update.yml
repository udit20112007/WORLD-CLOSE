name: Update World Close

# One workflow for all 33 exchanges. Every run checks every exchange; each one only
# downloads when it has a finished session it hasn't saved yet, so extra runs are cheap.
# All the logic is in world-close-stage1/scripts/ci_run.sh, so changes never need edits here.
on:
  schedule:
    - cron: "45 9 * * 1-5"    # after China, Hong Kong, Taiwan and Korea close
    - cron: "30 10 * * 1-5"   # after Tokyo, Sydney, Singapore, Kuala Lumpur, Bangkok, Jakarta
    - cron: "30 13 * * 0-5"   # India (19:00 IST), Riyadh and Dubai; Sundays too for Saudi Arabia
    - cron: "30 16 * * 1-5"   # India second try (22:00 IST)
    - cron: "30 17 * * 1-5"   # after Europe, Istanbul, Johannesburg and Tel Aviv
    - cron: "30 22 * * 1-5"   # after Toronto and Mexico City
    - cron: "15 23 * * 1-5"   # after New York
    - cron: "0 1 * * 2-6"     # after Sao Paulo; second try for New York
    - cron: "30 1 * * 2-6"    # New York, late
    - cron: "30 11 * * 2-6"   # next-morning try for files published late
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also fill in this many past days of chart history (370 for a new exchange, otherwise 0)."
        default: "0"
      exchanges:
        description: "Which exchanges to update: all, or codes like NSE TSE LSE"
        default: "all"

permissions:
  contents: write   # save data to the data branch
  pages: write
  id-token: write

concurrency:
  group: world-close-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      built: ${{ steps.site.outputs.built }}
    defaults:
      run:
        working-directory: world-close-stage1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world-close-stage1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Update exchanges, save data, build the site
        id: update
        continue-on-error: true
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          EXCHANGES: ${{ github.event.inputs.exchanges || 'all' }}
          WC_TIME_BUDGET_MIN: "300"
          WC_KEEP_DAYS: "400"
        run: bash scripts/ci_run.sh "$BACKFILL_DAYS" $EXCHANGES

      - name: Check the site was built
        id: site
        run: test -f site/data/exchanges.json && echo "built=true" >> "$GITHUB_OUTPUT" || echo "::error::No site was built, so the live site is left as it is."

      - uses: actions/configure-pages@v6
        if: steps.site.outputs.built == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.site.outputs.built == 'true'
        with:
          path: world-close-stage1/site

      - name: Report failure
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Updating failed. See the update step's log and the site's Data status page."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
