name: Update US (NYSE, Nasdaq, NYSE American)

on:
  schedule:
    # After the 16:00 New York close: 19:15 EDT / 18:15 EST
    - cron: "15 23 * * 1-5"
    # Second try later the same New York evening (01:30 UTC is still Mon-Fri in New York)
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also fill in this many past days of chart history from Yahoo (best effort). Use 370 on the first run."
        default: "0"

permissions:
  contents: write   # save new daily files to the repository
  pages: write
  id-token: write

# Shared with the India workflow, so the two never push at the same time
concurrency:
  group: world-close-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: world-close-stage1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world-close-stage1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Download today's US closes
        id: update
        continue-on-error: true
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: python -m pipeline.run update --exchanges NYSE NASDAQ NYSEAM --backfill-days "$BACKFILL_DAYS"

      - name: Save new data to the repository
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data to save."
          else
            git commit -m "Data: US $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Build the site
        run: python -m pipeline.run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: world-close-stage1/site

      - name: Report failure
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::No US exchange could be updated. See the Download step's log and the site's Data status page."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
