name: Update India (NSE, BSE)

on:
  schedule:
    # NSE and BSE usually publish their daily files by about 18:00 IST.
    - cron: "30 13 * * 1-5"   # 19:00 IST
    - cron: "30 16 * * 1-5"   # 22:00 IST, catches files that were published late
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also download missing days this far back. Use 370 on the first run for a year of charts."
        default: "0"

permissions:
  contents: write   # save new daily files to the repository
  pages: write
  id-token: write

# Every exchange workflow shares this group, so they never push at the same time
concurrency:
  group: world-close-data
  cancel-in-progress: false

env:
  # The project files live in this folder of the repository
  PROJECT_DIR: world-close-stage1

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: world-close-stage1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world-close-stage1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Download new trading days
        id: update
        continue-on-error: true
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: python -m pipeline.run update --exchanges NSE BSE --backfill-days "$BACKFILL_DAYS"

      - name: Save new data to the repository
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data to save."
          else
            git commit -m "Data: NSE, BSE $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Build the site
        run: python -m pipeline.run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: world-close-stage1/site

      - name: Report failure
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::No exchange could be updated. See the Download step's log and the site's Data status page."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
