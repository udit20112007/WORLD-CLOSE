name: Update Asia and Brazil (China, Hong Kong, Taiwan, Korea, B3)

on:
  schedule:
    # Each exchange decides for itself whether there's anything new, so extra runs are harmless.
    - cron: "45 9 * * 1-5"    # after the Asian closes: 17:45 China/HK/Taiwan, 18:45 Korea (15:15 IST)
    - cron: "30 13 * * 1-5"   # second try for Asia (19:00 IST)
    - cron: "0 1 * * 2-6"     # after B3 closes: 22:00 in Sao Paulo
    - cron: "30 11 * * 2-6"   # next-morning try for B3 and Korea files published late
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also fill in this many past days of chart history. Use 370 on the first run."
        default: "0"

permissions:
  contents: write   # save new daily files to the repository
  pages: write
  id-token: write

# Shared with the India and US workflows, so they never push at the same time
concurrency:
  group: world-close-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: world-close-stage1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world-close-stage1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Download new trading days
        id: update
        continue-on-error: true
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          # Free key from openapi.krx.co.kr, stored under Settings -> Secrets and variables -> Actions
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
        run: python -m pipeline.run update --exchanges SSE SZSE HKEX TWSE KOSPI KOSDAQ B3 --backfill-days "$BACKFILL_DAYS"

      - name: Save new data to the repository
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data to save."
          else
            git commit -m "Data: Asia and Brazil $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Build the site
        run: python -m pipeline.run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: world-close-stage1/site

      - name: Report failure
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::None of these exchanges could be updated. See the Download step's log and the site's Data status page."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
